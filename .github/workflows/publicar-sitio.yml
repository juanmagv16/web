# Publicación y revisión automática del sitio de SUBE
# ------------------------------------------------------------
# Cada vez que se sube un cambio a la rama main (por ejemplo, una nota
# nueva en redaccion/ o una foto en assets/noticias/), GitHub:
#   1. Vuelve a generar el sitio (python build_site.py).
#   2. Revisa que las notas estén bien escritas: título, fecha en formato
#      AAAA-MM-DD, que no haya dos notas con el mismo nombre y que las
#      fotos mencionadas estén subidas. Si algo está mal, se detiene,
#      no publica nada y el cambio aparece con una cruz roja (el detalle
#      se ve en la pestaña "Actions").
#   3. Si está todo bien, guarda las páginas actualizadas y la nota
#      queda publicada en uno o dos minutos.
#
# En los Pull Request solo revisa, no publica.

name: Publicar y revisar el sitio

on:
  push:
    branches: [ "main", "prueba-publicacion" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Generar, revisar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el sitio y revisar las notas
        run: python build_site.py --revisar

      - name: Publicar las páginas actualizadas
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Las páginas ya estaban actualizadas: no hay nada para publicar."
            exit 0
          fi
          git status --short
          git config user.name "Redacción SUBE (automático)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar cambios de la redacción (automático)"
          git push

      - name: Verificar que las páginas estén actualizadas
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Hay páginas desactualizadas. Corré 'python3 build_site.py' y volvé a subir los archivos que cambien:"
            git status --short
            exit 1
          fi
          echo "Todo en orden: las páginas están actualizadas."
