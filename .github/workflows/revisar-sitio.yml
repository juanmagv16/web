# Revisión automática del sitio de SUBE
# ------------------------------------------------------------
# Cada vez que se sube un cambio, GitHub vuelve a generar el sitio y
# revisa que esté todo bien. Si encuentra un problema, el cambio
# aparece con una cruz roja y el detalle se ve en la pestaña "Actions".
#
# Qué revisa:
#  1. Que las notas de redaccion/ estén bien escritas (título, fecha
#     en formato AAAA-MM-DD, que no haya dos notas con el mismo nombre).
#  2. Que las fotos que mencionan las notas estén subidas a
#     assets/noticias/.
#  3. Que las páginas estén actualizadas: si se agregó o editó una nota
#     pero no se volvió a generar el sitio (python3 build_site.py),
#     la nota no se vería en la web.

name: Revisar el sitio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  revisar:
    name: Generar y revisar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el sitio y revisar las notas
        run: python build_site.py --revisar

      - name: Verificar que las páginas estén actualizadas
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Hay páginas desactualizadas. Corré 'python3 build_site.py' y volvé a subir los archivos que cambien:"
            git status --short
            exit 1
          fi
          echo "Todo en orden: las páginas están actualizadas."
