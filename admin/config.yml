# ============================================================
# Panel de la redacción de SUBE (Decap CMS)
# ------------------------------------------------------------
# Se entra desde /admin/ con una cuenta de GitHub que tenga acceso
# al repositorio. Cada nota se guarda como un archivo en redaccion/
# y las fotos en assets/noticias/. Al publicarla, GitHub regenera y
# publica el sitio solo (.github/workflows/publicar-sitio.yml).
# ============================================================

backend:
  name: github
  repo: juanmagv16/web          # al pasar al sitio oficial: subecanal/web
  branch: main
  # Servicio de inicio de sesión con GitHub (Cloudflare Worker de la cuenta
  # de Sube; código en github.com/subecanal/sube-redaccion-auth).
  base_url: https://sube-redaccion-auth.laplatasube.workers.dev
  commit_messages:
    create: "Redacción: nota nueva «{{slug}}»"
    update: "Redacción: nota editada «{{slug}}»"
    delete: "Redacción: nota borrada «{{slug}}»"
    uploadMedia: "Redacción: foto {{path}}"
    deleteMedia: "Redacción: foto borrada {{path}}"

# Flujo editorial: Borrador → En revisión → Lista. Solo se publica
# cuando alguien toca "Publicar" en una nota "Lista".
publish_mode: editorial_workflow

locale: es
site_url: https://juanmagv16.github.io/web
display_url: https://juanmagv16.github.io/web
logo_url: https://juanmagv16.github.io/web/assets/logo.png

# Direcciones de las notas: sin tildes ni eñes, palabras separadas por guiones.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: assets/noticias
public_folder: /assets/noticias

collections:
  - name: noticias
    label: Noticias
    label_singular: nota
    description: "Las notas de la sección Noticias. Las fotos se achican solas al publicar."
    folder: redaccion
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: titulo     # el nombre del archivo y la dirección salen del título
    slug: "{{slug}}"
    preview_path: "noticias/{{slug}}.html"
    summary: "{{fecha}} · {{seccion}} · {{jerarquia}} · {{titulo}}"
    sortable_fields: ["fecha", "titulo", "seccion", "jerarquia"]
    view_filters:
      - label: Principal
        field: jerarquia
        pattern: Principal
      - label: Destacadas
        field: jerarquia
        pattern: Destacada
      - label: Despublicadas
        field: publicar
        pattern: false
    fields:
      - label: Título
        name: titulo
        widget: string
      - label: Sección
        name: seccion
        widget: string
        default: Actualidad
        hint: "Por ejemplo: Política, Deportes, Cultura, Agenda. Cada sección nueva aparece sola como filtro en la portada de Noticias."
      - label: Fecha de publicación
        name: fecha
        widget: datetime
        format: YYYY-MM-DD
        default: "{{now}}"
        date_format: DD/MM/YYYY
        time_format: false
        picker_utc: false
      - label: Bajada
        name: bajada
        widget: text
        required: false
        hint: "Una o dos oraciones que resumen la nota. Aparece debajo del título y en la portada."
      - label: Firma
        name: autor
        widget: string
        required: false
        hint: "Si queda vacío, dice «Redacción SUBE»."
      - label: Foto principal
        name: imagen
        widget: image
        required: false
        choose_url: true
      - label: Epígrafe de la foto
        name: epigrafe
        widget: string
        required: false
      - label: Jerarquía
        name: jerarquia
        widget: select
        options: ["Principal", "Destacada", "Normal"]
        default: Normal
        hint: "Principal: la nota grande de arriba de todo en Noticias (si marcás otra como Principal, la anterior baja a Destacada). Destacada: va después de la principal, antes que las demás. Normal: por fecha. La home muestra las 3 primeras de ese orden."
      - label: Visible en la web
        name: publicar
        widget: boolean
        default: true
        hint: "Apagalo para sacar una nota de la web sin borrarla."
      - label: Nota
        name: body
        widget: markdown
        required: false
        buttons: ["bold", "italic", "link", "heading-two", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]
        hint: "Si queda vacía, la nota se publica con el aviso «Esta nota está en redacción»."
